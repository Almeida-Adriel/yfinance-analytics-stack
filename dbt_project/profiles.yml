yfinance_analytics_stack:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      user: "{{ env_var('DB_USER', 'airflow') }}"
      password: "{{ env_var('DB_PASSWORD', 'airflow') }}"
      dbname: "{{ env_var('DB_NAME', 'airflow') }}"
      schema: public
      threads: 4