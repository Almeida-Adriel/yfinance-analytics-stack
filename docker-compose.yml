services:
  postgres-app:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - astro-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - astro-net
    restart: always
    depends_on:
      postgres-app:
        condition: service_healthy

  streamlit-app:
    image: python:3.11-slim
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8501:8501"
    networks:
      - astro-net
    command: >
      sh -c "pip install -r requirements-streamlit.txt && 
      streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0"
    restart: always
  
  dbt-docs:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./dbt_project/target:/usr/share/nginx/html:ro
    restart: always

volumes:
  postgres-db-volume:

networks:
  astro-net:
    name: astro-net